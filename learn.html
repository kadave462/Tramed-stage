<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHARMACIE TRAMED LTD — Upload Data</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --green-dark: #0d5c36; --green-mid: #1a7a4a; }
    body { background: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
    .dashboard-header {
      background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 100%);
      color: #fff; padding: 18px 28px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
    }
    .brand { font-size: 1.35rem; font-weight: 700; }
    .subtitle { font-size: .82rem; opacity: .8; margin-top: 2px; }
    .upload-card {
      background: #fff; border-radius: 12px; padding: 32px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08); max-width: 560px; margin: 40px auto;
    }
  </style>
</head>
<body>

<div class="dashboard-header">
  <div>
    <div class="brand">&#9679; PHARMACIE TRAMED LTD</div>
    <div class="subtitle">Upload Data</div>
  </div>
  <a href="/" style="color:#fff; font-size:.85rem;">&#8592; Back to Dashboard</a>
</div>

<div class="container">
  <div class="upload-card">
    <h5 class="mb-1">Import Data</h5>
    <p class="text-muted small mb-4">Upload a sales or stock file — the app detects the type automatically.</p>

    <div class="mb-3">
      <input type="file" class="form-control" id="dataFile" accept=".csv,.xlsx">
    </div>

    <button class="btn btn-success w-100" onclick="uploadFile()">Uploads &amp; Import</button>

    <div id="result" class="mt-3"></div>
  </div>
</div>

<script>
async function uploadFile() {
  const fileInput = document.getElementById('dataFile')
  const resultDiv = document.getElementById('result')

  if (fileInput.files.length === 0) {
    resultDiv.innerHTML = '<div class="alert alert-warning">Please select a file first.</div>'
    return
  }

  const file = fileInput.files[0]
  const formData = new FormData()
  formData.append('file', file)

  resultDiv.innerHTML = '<div class="alert alert-info">Uploading...</div>'

  const response = await fetch('/api/upload', {
    method: 'POST',
    body: formData
  })

  const data = await response.json()

  if (response.ok) {
    resultDiv.innerHTML = `<div class="alert alert-success">&#10003; Detected: <strong>${data.fileType}</strong> — Imported <strong>${data.rowsImported}</strong> rows from <strong>${file.name}</strong></div>`
  } else {
    resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${data.error}</div>`
  }
}
</script>

</body>
</html>
