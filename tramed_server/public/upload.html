<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PHARMACIE TRAMED LTD — Upload Data</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --green-dark: #0d5c36;
        --green-mid: #1a7a4a;
      }

      body {
        background: #f4f6f9;
        font-family: "Segoe UI", sans-serif;
      }

      .dashboard-header {
        background: linear-gradient(
          135deg,
          var(--green-dark) 0%,
          var(--green-mid) 100%
        );
        color: #fff;
        padding: 18px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      }

      .brand {
        font-size: 1.35rem;
        font-weight: 700;
      }

      .subtitle {
        font-size: 0.82rem;
        opacity: 0.8;
        margin-top: 2px;
      }

      .upload-card {
        background: #fff;
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        max-width: 560px;
        margin: 40px auto;
      }
    </style>
  </head>

  <body>
    <div class="dashboard-header">
      <div>
        <div class="brand">PHARMACIE TRAMED LTD</div>
        <div class="subtitle">Upload Data</div>
      </div>
      <a href="/" style="color: #fff; font-size: 0.85rem"
        >&#8592; Back to Dashboard</a
      >
    </div>
    <div class="container">
      <div class="upload-card">
        <h5>Import Data</h5>
        <p>
          Upload a sale or stock file — the app detects the type automatically.
        </p>

        <input type="file" id="dataFile" accept=".csv,.xlsx" />

        <button onclick="uploadFile()">Upload & Import</button>

        <div id="result"></div>
        <div id="result2"></div>
      </div>

      <div>
        <button onclick="deleteAllsales()">Delete All Sales</button>
      </div>
      <div>
        <button onclick="deleteAllStock()">Delete All Stock</button>
      </div>
    </div>
    <script>
      async function uploadFile() {
        const fileInput = document.getElementById("dataFile");
        const resultDiv = document.getElementById("result");

        if (fileInput.files.length === 0) {
          resultDiv.innerHTML =
            '<div class="alert alert-warning">Please select a file first.</div>';
          return;
        }

        const fileuploaded = fileInput.files[0];
        const formData = new FormData();
        formData.append("file", fileuploaded);

        resultDiv.innerHTML =
          '<div class="alert alert-info">Uploading...</div>';

        const response = await fetch("/api/upload", {
          method: "POST",
          body: formData,
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.innerHTML = `<div class="alert alert-success">✓ Detected: <strong>${data.fileType}</strong> — Imported <strong>${data.rowsImported}</strong> rows from <strong>${fileuploaded.name}</strong></div>`;
        } else {
          resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${data.error}</div>`;
        }
      }

      async function deleteAllsales() {
        const resultDiv = document.getElementById("result");
        const res = await fetch("/api/sales", { method: "DELETE" });
        const data = await res.json();
        if (res.ok) {
          resultDiv.innerHTML = `<div class="alert alert-success">✓ deleted: <strong>${data.message}</strong> </div>`;
          console.log("de;eted");
        } else {
          resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${data.error}</div>`;
        }
        console.log(data.message);
      }

      async function deleteAllStock() {
        const resultDiv = document.getElementById("result");
        const res = await fetch("/api/stock", { method: "DELETE" });
        const data = await res.json();
        if (res.ok) {
          resultDiv.innerHTML = `<div class="alert alert-success">✓ ${data.message}</div>`;
        } else {
          resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${data.error}</div>`;
        }
        console.log(data.message);
      }
    </script>
  </body>
</html>
